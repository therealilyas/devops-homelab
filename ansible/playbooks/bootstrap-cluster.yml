---
- name: Initialize Kubernetes control plane
  hosts: k8s_control_plane
  gather_facts: true
  become: true

  tasks:
    - name: Check whether control plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_admin_conf

    - name: Initialize Kubernetes control plane
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --apiserver-advertise-address={{ ansible_facts["default_ipv4"]["address"] }}
          --control-plane-endpoint={{ ansible_facts["default_ipv4"]["address"] }}:6443
          --pod-network-cidr={{ kubernetes_pod_cidr }}
          --service-cidr={{ kubernetes_service_cidr }}
          --node-name={{ inventory_hostname }}
      when: not kubeadm_admin_conf.stat.exists
      register: kubeadm_init

    - name: Create kubeconfig directory for devops user
      ansible.builtin.file:
        path: /home/devops/.kube
        state: directory
        owner: devops
        group: devops
        mode: "0700"

    - name: Install admin kubeconfig for devops user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/devops/.kube/config
        remote_src: true
        owner: devops
        group: devops
        mode: "0600"

- name: Determine which workers need to join
  hosts: k8s_workers
  gather_facts: false
  become: true

  tasks:
    - name: Check whether worker is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_conf

    - name: Record worker join requirement
      ansible.builtin.set_fact:
        kubernetes_worker_needs_join: "{{ not worker_kubelet_conf.stat.exists }}"

- name: Generate a temporary worker join command
  hosts: k8s_control_plane
  gather_facts: false
  become: true

  tasks:
    - name: Check if any worker still needs to join
      ansible.builtin.set_fact:
        kubernetes_any_worker_needs_join: >-
          {{
            groups["k8s_workers"]
            | map("extract", hostvars, "kubernetes_worker_needs_join")
            | select("equalto", true)
            | list
            | length > 0
          }}

    - name: Generate kubeadm worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --ttl 30m --print-join-command
      register: kubeadm_join_command
      when: kubernetes_any_worker_needs_join
      changed_when: true
      no_log: true

    - name: Store worker join command for this run
      ansible.builtin.set_fact:
        kubernetes_join_command: "{{ kubeadm_join_command.stdout }}"
      when: kubernetes_any_worker_needs_join
      no_log: true

- name: Join Kubernetes workers
  hosts: k8s_workers
  gather_facts: false
  become: true

  tasks:
    - name: Join worker to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_control_plane'][0]]['kubernetes_join_command'] }}"
      when: kubernetes_worker_needs_join
      no_log: true

- name: Verify Kubernetes control plane state
  hosts: k8s_control_plane
  gather_facts: false
  become: false

  tasks:
    - name: Wait for all nodes to register
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /home/devops/.kube/config
      register: kubectl_nodes
      retries: 12
      delay: 5
      until: kubectl_nodes.rc == 0 and (kubectl_nodes.stdout_lines | length) >= 4
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        var: kubectl_nodes.stdout_lines
