---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Read current timezone
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false

- name: Set server timezone
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ common_timezone }}"
  when: current_timezone.stdout != common_timezone
  changed_when: true

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

- name: Enable and start QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Add managed Kubernetes host mappings
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} DEVOPS-HOMELAB K8S"
    block: |
      {% for host in cluster_hosts %}
      {{ host.ip }} {{ host.name }}
      {% endfor %}
